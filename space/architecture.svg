<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" role="img" aria-label="Newton net pipeline: extractor, reader and router, assembler, planner, output" font-family="sans-serif" font-size="13" fill="currentColor" stroke="currentColor">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g stroke-width="1.5" fill="none">
    <rect x="10" y="40" width="160" height="90" rx="8"/>
    <rect x="210" y="40" width="180" height="90" rx="8" stroke="#00BFC4" stroke-width="3"/>
    <rect x="430" y="40" width="160" height="90" rx="8"/>
    <rect x="630" y="40" width="160" height="90" rx="8"/>
    <rect x="830" y="40" width="120" height="90" rx="8"/>
    <path d="M170 85 H208 M390 85 H428 M590 85 H628 M790 85 H828" marker-end="url(#arrow)"/>
    <path d="M90 130 V205 M300 130 V205 M510 130 V205 M710 130 V205" stroke-dasharray="4 3"/>
    <path d="M80 205 H715" stroke="#F8766D" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g stroke="none" text-anchor="middle">
    <text x="90" y="25" font-size="12" opacity="0.7">question ≤160 chars</text>
    <text x="90" y="70" font-weight="bold">1. Extractor</text>
    <text x="90" y="90" font-size="11">number + unit → SI</text>
    <text x="90" y="105" font-size="11">"at &lt;speed1&gt; …"</text>
    <text x="300" y="25" font-size="12" fill="#00BFC4">learned (TinyLLM)</text>
    <text x="300" y="70" font-weight="bold">2. Reader + router</text>
    <text x="300" y="90" font-size="11">target, speed order,</text>
    <text x="300" y="105" font-size="11">sign, implied values</text>
    <text x="510" y="70" font-weight="bold">3. Assembler</text>
    <text x="510" y="90" font-size="11">one value each,</text>
    <text x="510" y="105" font-size="11">mass 2,000 kg</text>
    <text x="710" y="70" font-weight="bold">4. Planner</text>
    <text x="710" y="90" font-size="11">equations of</text>
    <text x="710" y="105" font-size="11">motion, F = m·a</text>
    <text x="890" y="80" font-weight="bold">5. Answer</text>
    <text x="890" y="98" font-size="11">+ trace</text>
    <text x="723" y="210" fill="#F8766D" text-anchor="start">refusal + reason</text>
    <text x="480" y="240" font-size="11" opacity="0.7">every stage except 2 is fixed code; any stage can refuse</text>
  </g>
</svg>
