<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" role="img" aria-label="Newton net pipeline: checker, extractor, reader and router, assembler, planner, output" font-family="sans-serif" font-size="13" fill="currentColor" stroke="currentColor">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g stroke-width="1.5" fill="none">
    <rect x="10" y="40" width="120" height="90" rx="8"/>
    <rect x="165" y="40" width="140" height="90" rx="8"/>
    <rect x="340" y="40" width="160" height="90" rx="8" stroke="#00BFC4" stroke-width="3"/>
    <rect x="535" y="40" width="130" height="90" rx="8"/>
    <rect x="700" y="40" width="130" height="90" rx="8"/>
    <rect x="865" y="40" width="85" height="90" rx="8"/>
    <path d="M130 85 H163 M305 85 H338 M500 85 H533 M665 85 H698 M830 85 H863" marker-end="url(#arrow)"/>
    <path d="M70 130 V205 M235 130 V205 M420 130 V205 M600 130 V205 M765 130 V205" stroke-dasharray="4 3"/>
    <path d="M60 205 H770" stroke="#F8766D" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g stroke="none" text-anchor="middle">
    <text x="70" y="25" font-size="12" opacity="0.7">question ≤160 chars</text>
    <text x="70" y="70" font-weight="bold">1. Checker</text>
    <text x="70" y="90" font-size="11">length, English,</text>
    <text x="70" y="105" font-size="11">one question</text>
    <text x="235" y="70" font-weight="bold">2. Extractor</text>
    <text x="235" y="90" font-size="11">number + unit → SI</text>
    <text x="235" y="105" font-size="11">"at &lt;speed1&gt; …"</text>
    <text x="420" y="25" font-size="12" fill="#00BFC4">learned (TinyLLM)</text>
    <text x="420" y="70" font-weight="bold">3. Reader + router</text>
    <text x="420" y="90" font-size="11">target, speed order,</text>
    <text x="420" y="105" font-size="11">sign, implied values</text>
    <text x="600" y="70" font-weight="bold">4. Assembler</text>
    <text x="600" y="90" font-size="11">one value each,</text>
    <text x="600" y="105" font-size="11">mass 2,000 kg</text>
    <text x="765" y="70" font-weight="bold">5. Planner</text>
    <text x="765" y="90" font-size="11">equations of</text>
    <text x="765" y="105" font-size="11">motion, F = m·a</text>
    <text x="907" y="80" font-weight="bold">6. Answer</text>
    <text x="907" y="98" font-size="11">+ trace</text>
    <text x="778" y="210" fill="#F8766D" text-anchor="start">refusal + reason</text>
    <text x="480" y="240" font-size="11" opacity="0.7">every stage except 3 is fixed code; any stage can refuse</text>
  </g>
</svg>
